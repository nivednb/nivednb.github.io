<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living infrastructure — experiment</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b141c;color:#dbe7e8;font:14px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}header,footer{position:fixed;left:5vw;right:5vw;pointer-events:none}header{top:5vh}h1{font-size:clamp(28px,5vw,58px);margin:0;font-weight:400;letter-spacing:-.05em}p{color:#9aafb8}footer{bottom:3vh;display:flex;justify-content:space-between;align-items:center}button,a{pointer-events:auto;color:inherit;background:#14242c;border:1px solid #49616b;padding:10px;text-decoration:none}nav{position:fixed;inset:0;pointer-events:none}nav a{position:absolute;transform:translate(-50%,-50%);background:#10242bea;min-width:120px;text-align:center}small{color:#9aafb8}nav a{isolation:isolate;overflow:hidden}nav a .assembly{position:absolute;inset:0;z-index:-1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}nav a .assembly i{background:#203943;border:1px solid #35515a;opacity:0}nav a .assembly i.on{opacity:.85}nav a:focus-visible{outline:2px solid white}#activity{position:fixed;right:5vw;top:6vh;max-width:190px;text-align:right;color:#a9bfc5;font-size:11px}@media(max-width:600px){#activity{top:18vh}nav a{min-width:92px;font-size:11px;padding:6px}}</style>
<canvas id="world"></canvas><header><small>INFRASTRUCTURE / EXPERIMENT 01</small><h1>Nived NB</h1><p>A living network of projects.</p></header><nav><a id="portfolio" href="/living-mind-tour-preview/">Living Mind<br><small>Research & engineering</small></a><a id="music" href="/MyPod/">MyPod<br><small>Audio systems</small></a></nav><aside id='activity'>Infrastructure online</aside><footer><small id="stats">Simulated activity</small><button id="pause">Pause motion</button></footer>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),bg=document.createElement('canvas'),b=bg.getContext('2d');let w,h,s,ox,oy,dpr,paused=false,t=0,last=0,frames=0,elapsed=0,fps=0;
let seed=421;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
const buildings=[];for(let y=0;y<8;y++)for(let x=0;x<12;x++){if((x>=3&&x<=5||x>=7&&x<=9)&&y>=3&&y<=4)continue; if(rnd()<.13)continue;buildings.push({x:55+x*75,y:45+y*64,w:26+rnd()*30,h:20+rnd()*20,kind:y<2?'home':'work',progress:1})}
const hubs=[{x:355,y:270,w:145,h:100,kind:'work',progress:1},{x:655,y:270,w:145,h:100,kind:'work',progress:1}];buildings.push(...hubs);const homes=buildings.filter(q=>q.kind==='home'),jobs=buildings.filter(q=>q.kind==='work');const agents=Array.from({length:900},(_,i)=>({home:homes[i%homes.length],job:jobs[Math.floor(rnd()*jobs.length)],phase:0,wait:rnd()*8,speed:20+rnd()*35,x:0,y:0,route:[],index:0,visible:false}));function door(q){return [q.x,q.y+q.h/2+3]}function route(a,z){let [x,y]=door(a),[u,v]=door(z),ay= a.y+31,zy=z.y+31,spine= a.x<500? 17:983;return [[x,y],[x,ay],[spine,ay],[spine,zy],[u,zy],[u,v]]}function depart(a,from,to){a.route=route(from,to);[a.x,a.y]=a.route[0];a.index=1;a.visible=true}
function step(a,dt){if(!a.visible){a.wait-=dt;if(a.wait>0)return;depart(a,a.phase===0?a.home:a.job,a.phase===0?a.job:a.home);return}let remaining=a.speed*dt;while(remaining>0&&a.index<a.route.length){let [x,y]=a.route[a.index],dx=x-a.x,dy=y-a.y,d=Math.hypot(dx,dy);if(d<=remaining){a.x=x;a.y=y;remaining-=d;a.index++}else{a.x+=dx/d*remaining;a.y+=dy/d*remaining;remaining=0}}if(a.index===a.route.length){a.visible=false;a.phase=1-a.phase;a.wait=5+rnd()*18;if(a.phase===0)a.job.progress=Math.min(1,a.job.progress+.08)}}
function transform(ctx){ctx.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy)}function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,1.5);c.width=bg.width=w*dpr;c.height=bg.height=h*dpr;s=Math.min(w/1000,h/760);ox=(w-1000*s)/2;oy=(h-560*s)/2+30;transform(b);b.strokeStyle='#192d38';b.lineWidth=.7;for(let x=0;x<1000;x+=15){b.beginPath();b.moveTo(x,0);b.lineTo(x,560);b.stroke()}for(let y=0;y<560;y+=15){b.beginPath();b.moveTo(0,y);b.lineTo(1000,y);b.stroke()}for(const q of buildings){b.strokeStyle='#29434d';b.beginPath();b.moveTo(q.x,q.y+q.h/2);b.lineTo(q.x,q.y+31);b.lineTo(17,q.y+31);b.lineTo(983,q.y+31);b.stroke()}for(const x of [17,983]){b.beginPath();b.moveTo(x,45);b.lineTo(x,525);b.stroke()}for(let i=0;i<2;i++){let q=hubs[i],el=document.getElementById(i?'music':'portfolio');el.style.left=ox+q.x*s+'px';el.style.top=oy+q.y*s+'px'}}addEventListener('resize',resize);resize();
const panels=[document.getElementById('portfolio'),document.getElementById('music')];for(const el of panels){let layer=document.createElement('span');layer.className='assembly';layer.setAttribute('aria-hidden','true');for(let i=0;i<24;i++)layer.appendChild(document.createElement('i'));el.appendChild(layer)}
const crews=Array.from({length:3},(_,i)=>({base:homes[i*3],target:hubs[i%2],start:8+i*19,period:65+i*11,role:i===0?'supervisor':'builder'}));
function crewDraw(){for(const crew of crews){let age=(t-crew.start)%crew.period;if(age<0||age>43)continue;let q=crew.target,points=route(crew.base,q),back=route(q,crew.base),work=age>=14&&age<29;let el=document.getElementById(q===hubs[0]?'portfolio':'music');if(work){let p=(age-14)/15;let count=Math.floor(p*24);if(crew.role==='builder'){for(let k=0;k<24;k++)el.querySelector('.assembly').children[k].classList.toggle('on',k<count);document.getElementById('activity').textContent='Construction crew · '+Math.round(p*100)+'% · '+(q===hubs[0]?'Living Mind':'MyPod')}else{document.getElementById('activity').textContent='Supervisor · interface inspection'}g.strokeStyle='#d1b77b';g.lineWidth=1;g.setLineDash([4,4]);g.strokeRect(q.x-q.w/2-8,q.y-q.h/2-8,q.w+16,q.h+16);g.setLineDash([]);g.fillStyle='#d1b77b';g.fillRect(q.x-q.w/2,q.y+q.h/2+5,q.w*p,2);el.style.borderColor='#d1b77b';el.style.boxShadow='0 0 '+(4+12*Math.sin(p*Math.PI))+'px #b49a6355';}let count=crew.role==='supervisor'?3:12;for(let j=0;j<count;j++){let x,y;if(work){let angle=j/count*Math.PI*2;x=q.x+Math.cos(angle)*(q.w/2+8);y=q.y+Math.sin(angle)*(q.h/2+8);}else{let path=age<14?points:back,progress=Math.max(0,Math.min(.9999,(age<14?age:age-29)/14)),lengths=path.slice(1).map((v,k)=>Math.hypot(v[0]-path[k][0],v[1]-path[k][1])),dist=progress*lengths.reduce((a,b)=>a+b,0),k=0;while(k<lengths.length-1&&dist>lengths[k])dist-=lengths[k++];let f=lengths[k]?dist/lengths[k]:0;x=path[k][0]+(path[k+1][0]-path[k][0])*f;y=path[k][1]+(path[k+1][1]-path[k][1])*f;}g.fillStyle=crew.role==='supervisor'?'#b6a6e3':'#e0bb79';g.fillRect(x-1.5+(j%3-1)*3,y-1.5+(Math.floor(j/3)-1)*3,3,3);}}}
const uiTargets=[...document.querySelectorAll('header small,header h1,header p,nav a,footer button,footer #stats')];let uiCycle=-1;function rebuildUI(){if(t<4.6){g.setTransform(dpr,0,0,dpr,0,0);for(let k=0;k<uiTargets.length;k++){let el=uiTargets[k],r=el.getBoundingClientRect(),age=t-k*.12,v=Math.max(0,Math.min(1,(age-.22)/1.05));el.style.clipPath=el.matches(':focus-within,:hover')?'':'inset(0 '+(100*(1-v))+'% 0 0)';for(let j=0;j<8;j++){let f=Math.max(0,Math.min(1,age/.22)),back=Math.max(0,Math.min(1,(t-2.15)/2.45)),x=r.left+r.width*v,y=r.top+r.height*(j+.5)/8,q=homes[(k*8+j)%homes.length],hx=ox+q.x*s,hy=oy+(q.y+q.h/2)*s;if(age<0)continue;g.fillStyle='#e7c995';g.fillRect((x*f+(w*.5)*(1-f))*(1-back)+hx*back,(y*f+12*(1-f))*(1-back)+hy*back,2.5,2.5)}}transform(g);return}const cycle=Math.floor(t/100),age=t%100;if(age<45||age>85){for(const el of uiTargets)el.style.clipPath='';return}let slot=Math.min(uiTargets.length-1,Math.floor((age-45)/5.7)),p=((age-45)%5.7)/5.7;for(let k=0;k<uiTargets.length;k++){const el=uiTargets[k];el.style.clipPath='';}let el=uiTargets[slot],rect=el.getBoundingClientRect(),home=homes[0],hx=ox+home.x*s,hy=oy+home.y*s;g.setTransform(dpr,0,0,dpr,0,0);for(let j=0;j<12;j++){let f=Math.min(1,p*4),back=Math.max(0,(p-.78)/.22),x=rect.left+rect.width*Math.min(1,p*2)+(j%3-1)*5,y=rect.top+rect.height*(j+.5)/12;g.fillStyle='#e7c995';g.fillRect(hx+(x-hx)*f*(1-back),hy+(y-hy)*f*(1-back),3,3)}document.getElementById('activity').textContent='Interface reconstruction · '+el.tagName.toLowerCase();transform(g)}
function draw(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;if(!paused){t+=dt;if(t>4.6)for(const a of agents)step(a,dt);if(Math.floor(t/8)!==Math.floor((t-dt)/8)){let q=jobs[Math.floor(rnd()*(jobs.length-2))];if(q.progress===1)q.progress=.75}}g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,c.width,c.height);g.globalAlpha=Math.max(0,Math.min(1,(t-2.4)/2.2));g.drawImage(bg,0,0);transform(g);for(const q of buildings){if(t<4.6 && (q.x+q.y*.5)/1250>Math.max(0,(t-2.4)/2.2))continue;g.fillStyle=q.kind==='home'?'#142b32':'#192d39';g.strokeStyle=q.progress<1?'#a18b60':'#42616b';g.fillRect(q.x-q.w/2,q.y-q.h/2,q.w,q.h);g.strokeRect(q.x-q.w/2,q.y-q.h/2,q.w,q.h);g.fillStyle='#45636a';g.fillRect(q.x-q.w/2+3,q.y-q.h/2+3,(q.w-6)*q.progress,3);for(let k=0;k<5;k++){g.fillStyle=k/5<q.progress?'#294550':'#101b23';g.fillRect(q.x-q.w/2+4+k*(q.w-8)/5,q.y-5,(q.w-8)/5-2,10)}g.fillStyle='#87b9b3';g.fillRect(q.x-2,q.y+q.h/2-2,4,4)}g.fillStyle='#80c6bd';g.beginPath();let n=0;for(const a of agents)if(a.visible){g.rect(a.x-1,a.y-1,2,2);n++}g.fill();g.globalAlpha=1;for(const id of ['portfolio','music']){let el=document.getElementById(id);el.style.borderColor='';el.style.boxShadow=''}document.getElementById('activity').textContent='Routine operations · simulated';if(t>4.6)crewDraw();rebuildUI();frames++;elapsed+=dt;if(elapsed>1){fps=Math.round(frames/elapsed);frames=elapsed=0;document.getElementById('stats').textContent='Simulated activity · '+n+' outdoors / '+agents.length+' residents · '+fps+' fps'}requestAnimationFrame(draw)}document.getElementById('pause').onclick=e=>{paused=!paused;if(paused&&t<5)t=5;e.target.textContent=paused?'Resume motion':'Pause motion'};if(matchMedia('(prefers-reduced-motion: reduce)').matches){paused=true;t=5;document.getElementById('pause').textContent='Resume motion'}requestAnimationFrame(draw);
</script></html>
