<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nived NB — Living infrastructure</title><style>*{box-sizing:border-box}body{margin:0;background:#09141b;color:#dce9e9;font:14px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}header,nav,footer{position:fixed;pointer-events:none}header{top:5%;left:5%}h1{font-size:clamp(28px,5vw,58px);font-weight:400;margin:0}p,small{color:#9bb3ba}nav{inset:0}a,button{pointer-events:auto;color:inherit;background:#10262e;border:1px solid #45636b;padding:10px;text-decoration:none}nav a{position:absolute;transform:translate(-50%,-50%);text-align:center}footer{bottom:3%;left:5%;right:5%;display:flex;justify-content:space-between;align-items:center}#status{max-width:55%} [data-build]{visibility:hidden}</style><canvas></canvas><header><small data-build>PERSONAL INFRASTRUCTURE</small><h1 data-build>Nived NB</h1><p data-build>A living network of projects.</p></header><nav><a data-build href="/living-mind-tour-preview/">Living Mind</a><a data-build href="/MyPod/">MyPod</a></nav><footer><small id="status">Nemix · initialization</small><span><button id="skip">Skip construction</button> <button id="pause">Pause</button></span></footer><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),ui=[...document.querySelectorAll('[data-build]')],links=[...document.querySelectorAll('nav a')];let W,H,S,X,Y,D,last=0,time=0,paused=false,stage='presentation',seed=721;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
const core={x:500,y:105,w:90,h:90,p:1,kind:'core'},nodes=[core],agents=[],tasks=[];let serial=0;
function node(x,y,kind,parent){let n={x,y,w:kind==='hub'?150:44,h:kind==='hub'?68:32,p:0,kind,parent,enabled:false};nodes.push(n);tasks.push({n,p:0,owner:null});return n}
const hubs=[node(315,270,'hub',core),node(685,270,'hub',core)];for(let j=0;j<2;j++){for(let i=0;i<12;i++){let x=(j?570:110)+(i%4)*85,y=365+Math.floor(i/4)*70;node(x,y,i<4?'home':'work',hubs[j]);}}
function worker(home,role){agents.push({id:serial++,home,role,x:home.x,y:home.y,state:'inside',wait:rnd()*1.5,task:null,speed:role==='primary'?280:90+rnd()*100})}for(let i=0;i<16;i++)worker(core,'primary');
const presentation=ui.map(el=>({el,p:0,owner:null}));function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.5);c.width=W*D;c.height=H*D;S=Math.min(W/1000,H/700);X=(W-1000*S)/2;Y=(H-590*S)/2;links.forEach((el,i)=>{el.style.left=X+hubs[i].x*S+'px';el.style.top=Y+hubs[i].y*S+'px'})}addEventListener('resize',resize);resize();
function target(t){if(t.el){let r=t.el.getBoundingClientRect();return {x:(r.left+r.width*t.p-X)/S,y:(r.top+r.height/2-Y)/S}}return {x:t.n.x-t.n.w/2+t.n.w*t.p,y:t.n.y}}
function move(a,q,dt){let dx=q.x-a.x,dy=q.y-a.y,d=Math.hypot(dx,dy),v=a.speed*dt;if(d<=v){a.x=q.x;a.y=q.y;return true}a.x+=dx/d*v;a.y+=dy/d*v;return false}
function enable(n){if(n.enabled)return;n.enabled=true;if(n.kind==='hub'||n.kind==='home'){for(let i=0;i<(n.kind==='hub'?14:9);i++)worker(n,'resident')}}
function complete(t){t.p=1;if(t.el){t.el.style.visibility='visible';t.el.style.clipPath=''}else{t.n.p=1;enable(t.n)}}
function tick(dt){time+=dt;if(stage==='presentation'&&presentation.every(t=>t.p===1)&&agents.every(a=>a.state==='inside'))stage='construction';if(stage==='construction'&&tasks.every(t=>t.p===1))stage='operations';
for(const a of agents){if(a.state==='inside'){a.wait-=dt;if(a.wait>0)continue;let pool=stage==='presentation'?presentation:tasks;let t=pool.find(t=>t.p<1&&!t.owner&&(t.el||t.n.parent===a.home||a.role==='primary'&&t.n.parent===core));if(!t&&stage==='operations'){let n=nodes.filter(n=>n.enabled&&n!==a.home)[Math.floor(rnd()*nodes.filter(n=>n.enabled&&n!==a.home).length)];if(n)t={n,p:0,maintenance:true}}if(!t)continue;t.owner=a;a.task=t;a.state='travel';}
let t=a.task;if(a.state==='travel'&&move(a,target(t),dt))a.state='work';else if(a.state==='work'){t.p=Math.min(1,t.p+dt*(t.el?1.2:t.maintenance?.35:.55));move(a,target(t),dt);if(t.el){t.el.style.visibility='visible';t.el.style.clipPath='inset(0 '+(100*(1-t.p))+'% 0 0)'}else if(!t.maintenance)t.n.p=t.p;if(t.p===1){if(!t.maintenance)complete(t);a.state='return'}}else if(a.state==='return'&&move(a,a.home,dt)){a.state='inside';a.task=null;a.wait=1+rnd()*7}}
}
function render(){g.setTransform(D*S,0,0,D*S,D*X,D*Y);g.clearRect(-X/S,-Y/S,W/S,H/S);g.lineWidth=1;for(const n of nodes){if(n.p<=0)continue;if(n.parent){g.strokeStyle='#34515a';g.beginPath();g.moveTo(n.parent.x,n.parent.y);g.lineTo(n.x,n.parent.y);g.lineTo(n.x,n.parent.y+(n.y-n.parent.y)*n.p);g.stroke()}if(n===core){g.strokeStyle='#78b9b6';g.beginPath();g.arc(n.x,n.y,43,0,Math.PI*2);g.stroke();g.beginPath();g.arc(n.x,n.y,34,time*.4,time*.4+4);g.stroke();g.fillStyle='#c1e0dd';g.font='12px system-ui';g.textAlign='center';g.fillText('NEMIX',n.x,n.y+4);continue}g.fillStyle='#19343e';g.fillRect(n.x-n.w/2,n.y-n.h/2,n.w*n.p,n.h);g.strokeStyle=n.enabled?'#517b80':'#d2b77c';g.strokeRect(n.x-n.w/2,n.y-n.h/2,n.w*n.p,n.h);for(let k=0;k<Math.floor(n.p*5);k++){g.fillStyle='#42636b';g.fillRect(n.x-n.w/2+4+k*(n.w-8)/5,n.y+8,(n.w-8)/5-2,5)}}for(const a of agents){if(a.state==='inside')continue;g.fillStyle=a.role==='primary'?'#efd092':'#81c8bc';g.beginPath();g.arc(a.x,a.y,a.role==='primary'?3:1.6,0,Math.PI*2);g.fill();if(a.state==='work'){g.strokeStyle=g.fillStyle;g.beginPath();g.arc(a.x,a.y,5+Math.sin(time*8)*2,0,Math.PI*2);g.stroke()}}document.querySelector('#status').textContent=stage+' · '+nodes.filter(n=>n.enabled).length+'/'+(nodes.length-1)+' facilities · '+agents.filter(a=>a.state!=='inside').length+' active · simulated'}
function frame(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;if(!paused)tick(dt);render();requestAnimationFrame(frame)}function skip(){presentation.forEach(complete);tasks.forEach(complete);for(const a of agents){a.state='inside';a.task=null;a.x=a.home.x;a.y=a.home.y}stage='operations'}document.querySelector('#skip').onclick=skip;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};if(matchMedia('(prefers-reduced-motion: reduce)').matches){skip();paused=true}requestAnimationFrame(frame);
</script></html>
