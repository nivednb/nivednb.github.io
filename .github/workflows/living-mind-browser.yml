name: Living Mind browser validation
on:
  push:
    branches: [prototype/living-mind]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          mkdir -p screenshots
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          (async()=>{
            const browser=await chromium.launch();
            for(const [name,width,height,reducedMotion] of [['desktop',1440,900,'no-preference'],['mobile',390,844,'no-preference'],['reduced',390,844,'reduce']]){
              const page=await browser.newPage({viewport:{width,height},reducedMotion});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.setContent(fs.readFileSync('experiments/living-mind/index.html','utf8'));
              await page.waitForTimeout(800);
              await page.screenshot({path:'screenshots/'+name+'-home.png'});
              assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
              await page.locator('#work').scrollIntoViewIfNeeded();
              await page.waitForTimeout(800);
              for(const button of await page.locator('[data-focus]').all()){
                await button.click();
                await page.waitForTimeout(400);
                assert.equal(await button.getAttribute('aria-pressed'),await button.getAttribute('data-focus')===''?'false':'true');
              }
              await page.locator('[data-focus]').first().click();
              await page.waitForTimeout(900);
              await page.screenshot({path:'screenshots/'+name+'-project.png'});
              assert.deepEqual(errors,[]);
              await page.close();
              console.log(name+' PASS');
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-mind-browser-screenshots
          path: screenshots/
